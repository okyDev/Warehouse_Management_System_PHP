<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfica con Chart.js</title>
    <script src="chart.umd.js"></script>
</head>
<body>
    <h1>Gráfica de Ejemplo</h1>
    <canvas id="myChart" width="400" height="200"></canvas>
    <script>
        const ctx = document.getElementById('myChart').getContext('2d');

        const data = {
            labels: ['A', 'B', 'C', 'D'], // Etiquetas para las columnas
            datasets: [{
                label: 'Valores Ejemplo',
                data: [10, 15, 5, 20], // Valores de ejemplo
                backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(75, 192, 192, 0.2)'
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)'
                ],
                borderWidth: 1
            }]
        };

        const myChart = new Chart(ctx, {
            type: 'bar', // Tipo de gráfico: 'bar' para barras
            data: data,
            options: {
                scales: {
                    y: {
                        beginAtZero: true, // Comenzar el eje Y en cero
                        title: {
                            display: true,
                            text: 'Valores'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
